name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"

jobs:
  lint:
    name: Lint and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Verify no third-party dependencies
        # cppm exists to relieve dependency pain, so it carries none itself.
        # go.sum appearing means something slipped in.
        run: |
          if [ -s go.sum ]; then
            echo "go.sum is non-empty: a third-party dependency was added."
            cat go.sum
            exit 1
          fi
          go mod tidy
          git diff --exit-code go.mod

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # cppm drives these; without them the end-to-end tests skip rather than
      # fail, which would hide real breakage.
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Show toolchain
        shell: bash
        run: |
          go version
          cmake --version
          ninja --version
          git --version

      - name: Unit tests
        shell: bash
        run: go test -count=1 ./...

      - name: Race detector
        shell: bash
        # Short mode skips the network and compiler-heavy tests; this run is
        # about data races in cppm itself.
        run: go test -count=1 -race -short ./...

      - name: Self-check with the built binary
        shell: bash
        run: |
          go build -o cppm_bin ./cmd/cppm
          ./cppm_bin --version
          ./cppm_bin doctor || true   # a missing optional tool must not fail CI
          ./cppm_bin init SmokeApp
          cd SmokeApp
          ../cppm_bin build
          ../cppm_bin list
          ../cppm_bin doctor

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Test with coverage
        run: go test -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Report
        run: |
          go tool cover -func=coverage.out | tail -30
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')"
          echo "Total coverage: $total"
          echo "### Coverage: $total" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  cross-build:
    name: Cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build every release target
        # Catches platform-specific compile errors without waiting for a tag.
        run: |
          set -eu
          for target in \
            linux/amd64 linux/arm64 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            printf '%-16s' "$target"
            GOOS="$os" GOARCH="$arch" go build -trimpath -o /dev/null ./...
            echo OK
          done

  scripts:
    name: Installer scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint install.sh
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          sh -n install.sh
          shellcheck -s sh install.sh

      - name: Lint install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { $_.Message }; exit 1 }
          Write-Host "install.ps1 parses cleanly"

      - name: install.sh --from-source works
        run: |
          ./install.sh --from-source --dir "$HOME/.local/bin"
          "$HOME/.local/bin/cppm" --version
